# Proposed full CPU evaluation; raw access confirmed by author, replay not built yet.
schema_version: 1
status: proposed
experiment:
  name: causal_ppg_cpu
  device: cpu
  seeds: [2026, 2027, 2028]
  offline_after_setup: true
  threads: 4
data:
  mode: cached_replay
  available_source: private_cf_controlled_mat_export
  source_record_count: 1620
  source_subject_count: 9
  source_segment_samples: 1250
  source_reference_spo2_range: [95, 97]
  force_resolution: segment_level
  timing_fault_metadata: synthetic_not_raw_alignment_evidence
  manifest: data/replay/cpu_manifest.json
  access: author_confirmed_course_use
  redistribution: separate_permission_required
  required_evidence: [ppg_red, ppg_ir, contact_force]
  reference_label: spo2_reference
  reference_at_inference: false
  max_records: 10000
  split: leave_one_subject_out_with_subject_disjoint_validation
  additional_split: force_level_or_band_holdout
  force_holdouts: data/replay/force_holdouts.json
  holdout_manifest_must_be_frozen_before_test: true
  label_alignment: native_reference_support
  fit_preprocessing_on: training_only
  selection_manifest: data/replay/record_selection.json
models:
  baselines: [training_label_mean, ridge, ppg_only_mlp, ppg_force_fusion_mlp]
  proposed: ratio_correction_mlp
  hidden_sizes: [64, 64]
  residual_inputs: [ac_red, dc_red, ac_ir, dc_ir, ratio]
  force_enters: ratio_correction_only
  physical_head: decreasing_sigmoid
  residual_limit_percentage_points: 2.0
  output_bounds_percentage_points: [90.0, 100.0]
  output_bounds_scope: current_static_dataset_only
  ablations: [no_ratio_correction, no_residual, no_physical_branch_supervision]
  shared_tuning_budget: true
training:
  epochs_max: 50
  early_stopping_patience: 8
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  loss: huber
  physical_branch_weight: 0.25
verification:
  threshold_manifest: data/replay/calibration_manifest.json
  fit_thresholds_on: training_and_validation_subjects_only
  absent_calibration: unknown
  checkers:
    evidence_integrity:
      tests: [required_channels, finite_values, source_hashes, timestamp_alignment, units, clipping_missingness]
    model_applicability:
      tests: [model_manifest_hash, force_feature_support, calibration_available, output_residual_validity]
  independent_results: true
gate:
  release_if: all_checkers_pass_and_provenance_complete
  on_unknown_or_exception: defer
  invariant: release_implies_two_passes_and_complete_provenance
repair:
  allowed: [restore_verified_cached_record, select_existing_valid_synchronized_window]
  max_attempts: 1
  recheck_both: true
  unresolved_action: request_reacquisition
failure_injection:
  cases: [force_dropout, timestamp_offset, red_ir_swap, clipping, force_shift, model_hash_tamper, checker_exception]
  expected_dispositions: experiments/expected_failures.json
  keep_clean_paired_records: true
evaluation:
  task_metrics: [subject_mae, subject_rmse, force_bin_error_spread, spearman, standard_deviation_ratio, bland_altman_limits_width]
  policy_metrics: [coverage, false_admission, unnecessary_deferral, support_violation, tolerance_error, failure_detection, repair_success, required_check_coverage]
  unsafe_error_tolerance_percentage_points: 1.0
  tolerance_scope: research_only_not_clinical
  include_risk_coverage_curve: true
  compare_gated_and_ungated: true
  compare_common_windows: true
  statistical_unit: subject
  bootstrap_unit: subject
  evaluative_labels_hidden_from_gate: true
resources:
  cpu_cores_max: 4
  memory_limit_gib: 16
  estimated_peak_memory_gib: 8
  full_baseline_estimate_hours: [1, 3]
  full_baseline_limit_hours: 4
  evaluation_estimate_hours: 1
  evaluation_limit_hours: 2
  estimates_are_measured: false
  on_budget_exceeded: reduce_tuning_then_ridge_with_gate_and_failure_tests
outputs:
  directory: experiments/cpu
  receipt: experiments/receipt.json
  compute: experiments/compute.json
  trace: experiments/cpu/trace.jsonl
  require_relative_paths_and_hashes: true
